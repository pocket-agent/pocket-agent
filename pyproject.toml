[project]
name = "pocket-agent"
version = "0.1.0"
description = "Private, self-hosted personal AI assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyJWT>=2.9.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-telegram-bot>=21.0",
    "pyyaml>=6.0.0",
    "duckduckgo-search>=7.0.0",
    "ddgs>=9.0.0",
    "icalendar>=6.0.0",
    "starlette>=0.41.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
pocket-agent = "pocket_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pocket_agent"]

[tool.hatch.build.targets.sdist]
packages = ["pocket_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
