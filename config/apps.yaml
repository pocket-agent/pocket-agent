apps:
  web:
    repo: https://github.com/pocket-agent/pocket-agent-web-app.git
    path: apps/web
    deploy: cloudflare-pages
    description: React dashboard — Google OAuth in browser, calls API worker
  api:
    repo: https://github.com/pocket-agent/pocket-agent-api-app.git
    path: apps/api
    deploy: cloudflare-worker
    stack: hono
    description: Hono Worker — Google OAuth verify, proxy to Pocket Node (or cloud relay)
  cli:
    repo: https://github.com/pocket-agent/pocket-agent-cli.git
    path: apps/cli
    deploy: none
    enabled: false
    description: Terminal client (desktop install only, future)

# Pocket Node URL registered with the API worker (production).
# Local dev defaults to http://127.0.0.1:8787 via pocket-agent serve.
pocket_node:
  local_url: http://127.0.0.1:8787
  # tunnel_url: https://your-tunnel.example.com  # Cloudflare Tunnel to local agent
