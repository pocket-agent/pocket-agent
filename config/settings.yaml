agent:
  name: pocket-agent

telegram:
  poll_interval: 1.0

logging:
  level: INFO

http:
  host: 0.0.0.0
  port: 8787
  serve_static: true
  static_dir: ../pocket-agent-app/dist/client
  allowed_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:4173
    - http://127.0.0.1:4173

# Allowlisted scripts for run_allowed_script (paths relative to pocket-agent repo root).
automation:
  allowed_scripts: []
  # - name: example
  #   path: scripts/example.sh
  #   description: Optional maintenance script
